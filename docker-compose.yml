services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lk_ecom_orders_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ONE_C_API_URL: ${ONE_C_API_URL:-http://dev.1c.ikorniysrv.ru:85/eshop/hs/PAPI/v1}
    expose:
      - "3000"
    networks:
      - webnet

  nginx:
    image: nginx:1.27-alpine
    container_name: lk_ecom_orders_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - webnet

  # one-off / periodic certificate issuance & renewal
  certbot:
    image: certbot/certbot:latest
    container_name: lk_ecom_orders_certbot
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

networks:
  webnet:
    driver: bridge
